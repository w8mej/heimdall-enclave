name: Heimdall-Enclave Security & Verification Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # checkov:skip=CKV_GHA_7:Boolean-only manual fuzz toggle; not passed to build outputs
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Run continuous formal invariant fuzzing suite"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-doc-lint:
    name: Multi-Language, Secret & Doc Linter
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: 0.70.0

      - name: Install Linting & Security Verification Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cryptography==43.0.3' 'jsonschema==4.23.0' ruff bandit semgrep yamllint
          brew install shellcheck
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.23.0

      - name: Install Pinned Lean Toolchain
        shell: bash
        working-directory: .
        run: ./scripts/install-lean-toolchain.sh

      - name: Fetch locked mathematics dependencies and cache
        shell: bash
        working-directory: proofs/lean4
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Mandatory Lean compiler gate
        shell: bash
        working-directory: .
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/check-lean.py
          python3 scripts/tests/test_lean_gate.py

      - name: Export installed compiler path for the master linter
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run Workspace Master Linter
        env:
          FUZZ_INPUT: ${{ github.event.inputs.fuzz }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$FUZZ_INPUT" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "Running master verification sweep WITH formal bisimulation fuzzing..."
            ./scripts/lint-all.sh --fuzz
          else
            ./scripts/lint-all.sh
          fi

      - name: Upload Formal Fuzzing Audit Report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: formal-fuzz-report
          path: reports/fuzz-report.*
          if-no-files-found: ignore

      - name: Generate SAST SARIF Report
        if: always()
        run: |
          if command -v semgrep &>/dev/null; then
            semgrep scan \
              --exclude="target" \
              --exclude=".trunk" \
              --config "p/rust" \
              --config "p/python" \
              --config "p/security-audit" \
              --config ".semgrep.yml" \
              --exclude-rule "rust.lang.security.unsafe-usage.unsafe-usage" \
              --exclude-rule "rust.lang.security.temp-dir.temp-dir" \
              --exclude-rule "rust.lang.security.args.args" \
              --exclude-rule "rust.lang.security.current-exe.current-exe" \
              --exclude-rule "python.lang.security.audit.insecure-file-permissions.insecure-file-permissions" \
              --sarif --output semgrep.sarif || true
          fi

      - name: Upload SAST Findings to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@48ab28a6f5dab2a725327a667247024d418612cf # v3.28.11
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

