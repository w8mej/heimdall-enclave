name: CI - Heimdall Enclave Verification & Policy Regression

# F-007 / F-036: least-privilege token, SHA-pinned actions, and an honest split between
# VM-compatible checks (GitHub-hosted runners) and bare-metal SEP/FileVault checks.
#
# GitHub-hosted macos-14 runners are Virtualization.framework guests: ioreg exposes no
# AppleSEPManager and FileVault reports Off. Those checks are therefore SKIPPED (and
# reported as skipped) in --ci-vm mode, never silently passed. Every policy, pf, SQL AST,
# DLP, DPoP, attestation-tamper, audit-chain and JSON Schema test still runs strictly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mdm-tooling:
    name: MDM and fleet delivery profile validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test MDM mobileconfig and launchd profile definitions
        run: |
          python3 -B -m unittest scripts.tests.test_mdm_profiles

  hardware-source-policy:
    name: Hardware workflow source policy (F126)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install workflow parser
        run: python3 -m pip install 'PyYAML==6.0.2'
      - name: Check hardware restrictions and their adversarial regressions
        run: |
          python3 scripts/check-hardware-ci.py
          python3 scripts/tests/test_hardware_ci.py

  ci-vm-compatible:
    name: VM-Compatible Verification (policy, pf, SQL AST, DLP, DPoP, schemas)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: 0.70.0

      - name: Install Pinned Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cryptography==43.0.3' 'jsonschema==4.23.0'

      - name: Pre-Publish Hygiene Gate (F-031)
        run: |
          test -f LICENSE
          test -f SECURITY.md
          if git ls-files | grep -E '\.(swp|swo|swn)$'; then echo "swap file tracked"; exit 1; fi

      - name: Bootstrap Into Unprivileged Prefix (no root, no SEP/FileVault gate)
        run: |
          ./scripts/bootstrap-laptop.sh --ci-vm --prefix "$RUNNER_TEMP/enclave"

      - name: Execute Verification Suite (VM mode)
        run: |
          ./scripts/verify-enclave.sh --ci-vm

  bare-metal-sep:
    needs: hardware-source-policy
    name: Bare-Metal Apple Silicon SEP & FileVault Verification
    # Requires a provisioned self-hosted Mac (OQ-06). Disabled unless the repository
    # variable ENABLE_BARE_METAL_SEP is set to 'true', so the job never hangs waiting.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ENABLE_BARE_METAL_SEP == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, bare-metal-sep]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Execute Full Verification Suite (hardware mode)
        run: |
          ./scripts/verify-enclave.sh

  # ---------------------------------------------------------------------------
  # GAP-42: the Rust workspace (crates/) is built, linted and tested on every
  # change. No third-party toolchain action: the runners' preinstalled rustup
  # installs the toolchain (F-007: only SHA-pinned actions).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is an Apple-silicon (M1) VM: no SEP, but it compiles and
        # tests the macOS code paths, including the IOKit HID transport.
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (stable, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Build (all targets, locked)
        run: cargo build --workspace --all-targets --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the IOKit HID transport (macOS)
        if: runner.os == 'macOS'
        run: cargo build -p enclave-custody-vaultd --features macos-hid --locked

      - name: Tests (incl. the five-daemon fleet)
        run: cargo test --workspace --locked --no-fail-fast

      - name: Release build has no simulated hardware (GAP-03)
        run: ./scripts/check-release-no-simulation.sh

  rust-advisories:
    name: Rust dependency advisories (deny and audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install advisory checkers
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.23.0
      - name: Check shared exception policy and both advisory gates
        run: python3 scripts/check-advisories.py

  rust-multi-uid:
    name: Multi-UID mesh and cross-UID revocation (root, Linux)
    # GAP-01 / GAP-21: five distinct daemon UIDs, the production socket layout,
    # and the root supervisor killing a UID 701 holder of a revoked artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the test binary (unprivileged)
        run: |
          cargo test -p enclave-core --test multiuid --locked --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "multiuid") | .executable' > multiuid.bin
          test -s multiuid.bin
      - name: Run as root (must not skip)
        run: |
          bin=$(cat multiuid.bin)
          sudo "$bin" --test-threads=1 --nocapture 2>&1 | tee multiuid.log
          if grep -q 'skipped' multiuid.log; then echo "multi-UID tests were skipped"; exit 1; fi
          grep -q 'test result: ok. 2 passed' multiuid.log

  rust-apple-silicon-hardware:
    needs: hardware-source-policy
    name: Rust on bare-metal Apple silicon (self-hosted M1)
    # GAP-13 / GAP-22 / GAP-36 / GAP-37 / GAP-38 need a physical Mac (SEP,
    # YubiKey, launchd + Seatbelt, M1 measurements). Disabled unless the
    # repository variable ENABLE_SELF_HOSTED_M1 is 'true'.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ENABLE_SELF_HOSTED_M1 == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, bare-metal-sep]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, lint, IOKit HID build, tests
        run: |
          cargo build --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build -p enclave-custody-vaultd --features macos-hid --locked
          cargo test --workspace --locked --no-fail-fast
      - name: Release build has no simulated hardware (GAP-03)
        run: ./scripts/check-release-no-simulation.sh
