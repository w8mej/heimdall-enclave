---
# L3 example; build with MCPMAC_BUILD_PROFILE=L3 and MCPMAC_PKG_PROFILE=L3.
# Fleet GitOps software specification for MCPMac Enterprise Enclave (FS-706)
apiVersion: v1
kind: software
spec:
  packages:
    - url: https://dist.enterprise.internal/enclave/MCPMac-Enclave-3.0.0.pkg
      self_service: false
      install_script: |
        #!/bin/sh
        set -eu
        # Fleet must verify the configured package digest/signature before this script.
        /usr/sbin/pkgutil --check-signature MCPMac-Enclave-3.0.0.pkg
        /usr/sbin/installer -pkg MCPMac-Enclave-3.0.0.pkg -target /
        /opt/enterprise/enclave/bin/mcp-enclave deploy preflight --profile L3
        # The package postinstall already ran the canonical L3 installer.
        /opt/enterprise/enclave/bin/mcp-enclave deploy verify --profile L3
        /opt/enterprise/enclave/bin/mcp-enclave deploy healthcheck --profile L3 --json
      post_install_query: |
        SELECT 1 WHERE (SELECT COUNT(*) FROM launchd
          WHERE label IN ('com.enterprise.enclave.supervisor', 'com.enterprise.enclave.cas', 'com.enterprise.enclave.apfs-broker')
          AND run_at_load = '1') = 3;
        -- Inventory only; authenticated serving is checked by deploy healthcheck --profile L3.
      uninstall_script: |
        #!/bin/sh
        set -eu
        /opt/enterprise/enclave/bin/mcp-enclave deploy purge --profile L3 --yes
