# ==============================================================================
# SPIRE Agent Configuration for macOS Darwin (Apple Silicon) — v1.0-Legacy prototype
#
#   *** DEV-SIMULATION-ONLY CONFIGURATION ***
#   - KeyManager "disk" stores the agent's private keys as files on disk. This VIOLATES
#     CORE-V1 Invariant 4 (keys in the Secure Enclave) and is acceptable only for local
#     simulation. A production deployment requires a custom KeyManager "apple_sep" plugin
#     (not provided) or, per OQ-09/ADR-010, dropping SPIRE on L1 in favour of kernel
#     LOCAL_PEERTOKEN (audit_token_t) + SecCodeCopyGuestWithAttributes in the v3.0 daemons.
#   - NodeAttestor "join_token" is a single-use bootstrap secret, not hardware attestation.
#   - WorkloadAttestor "unix" does not evaluate Apple code-signing requirements (no TeamID
#     or cdhash selectors); identity/macos_attestation.py performs that check separately.
#
# Paths match gateway/envoy-local.yaml and scripts/bootstrap-laptop.sh (default prefix
# /opt/enterprise/enclave; root-owned 0750). trust_domain is a deployment parameter that MUST
# equal data.config.trust_domain in policies/depot_authz.rego and depot_TRUST_DOMAIN.
# ==============================================================================

agent {
  data_dir = "/opt/enterprise/enclave/spire/data"
  log_level = "INFO"
  server_address = "127.0.0.1"
  server_port = 8081
  socket_path = "/var/run/spire/agent.sock"
  trust_bundle_path = "/opt/enterprise/enclave/certs/local-ca.crt"
  trust_domain = "corporate.internal"
}

plugins {
  # DEV-SIMULATION-ONLY: replace with hardware-backed node attestation in production.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # DEV-SIMULATION-ONLY: software keys on disk (0700 directory created by bootstrap-laptop.sh).
  KeyManager "disk" {
    plugin_data {
      directory = "/opt/enterprise/enclave/spire/keys"
    }
  }

  # Unix workload attestor: uid/gid/path selectors only. Code-signing (TeamID/cdhash/csreq)
  # is NOT evaluated by this plugin.
  WorkloadAttestor "unix" {
    plugin_data {
      discover_workload_path = true
    }
  }
}
