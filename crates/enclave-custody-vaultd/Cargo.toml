[package]
name = "enclave-custody-vaultd"
description = "UID 703 _piivault: FIDO2 CTAP 2.1+ client, CoreAuthUI bridge, chained Touch ID -> YubiKey ceremonies, dual-key vault (FS-703)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "enclave-fido-emulator"
path = "src/bin/enclave-fido-emulator.rs"
required-features = ["ctap-emulator"]

[features]
default = []
# Native IOHIDManager transport for physical authenticators (macOS only).
macos-hid = []
# GAP-03: software SEP, scripted/auto-approving CoreAuthUI, the virtual CTAP
# authenticator and the always-approving L3 egress gate. Never enabled in a
# release build; `--simulated-hardware` fails with SIMULATION_NOT_COMPILED
# without it.
simulation = ["ctap-emulator"]
# GAP-13: the out-of-process CTAPHID authenticator emulator
# (`enclave-fido-emulator`) and UID 703's `--yubikey-transport emulated:`.
# Off in a release build; the default transport is IOKit HID.
ctap-emulator = []

[dependencies]
enclave-core = { path = "../enclave-core" }
enclave-crypto = { path = "../enclave-crypto" }
enclave-zk-auditor = { path = "../enclave-zk-auditor" }
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
hex.workspace = true
blake3.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
aes.workspace = true
cbc.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true
libc.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen.workspace = true
enclave-model-runnerd = { path = "../enclave-model-runnerd" }
# Integration tests drive the virtual authenticator and scripted CoreAuthUI.
enclave-custody-vaultd = { path = ".", features = ["simulation"] }

[lints]
workspace = true
